name: QB validation lab

on:
  push:
    paths:
      - "scripts/run_qb_validation_lab.py"
      - ".github/workflows/qb-validation-lab.yml"
      - "data/raw/qbs/**"
      - "data/external/NFLQBs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: pip install pandas numpy scikit-learn
      - name: Run leakage-safe QB validation
        run: python scripts/run_qb_validation_lab.py
      - name: Commit generated QB reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add reports/qb_validation/ data/qb_projections/
          git diff --cached --quiet || git commit -m "Run QB walk-forward validation lab"
          git push || (git pull --rebase origin main && git push)
