name: Import public NFL source data

on:
  push:
    paths:
      - "scripts/import_public_nfl_sources.py"
      - ".github/workflows/import-public-nfl-sources.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror public NFL data artifacts
        run: python3 scripts/import_public_nfl_sources.py
      - name: Commit imported source artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/external/
          git diff --cached --quiet || git commit -m "Import public NFL source data"
          git push
